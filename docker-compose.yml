# Tripwaley — production compose.
# On Dokploy you can either use this file (Compose service) or, simpler, create
# an "Application" with Build Type = Dockerfile and set volumes/domain/env in the
# UI. Either way the two named volumes below are what make the admin CMS data and
# uploaded photos survive redeploys.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # set these in Dokploy's Environment tab (do NOT commit real secrets)
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      SESSION_SECRET: ${SESSION_SECRET}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
    volumes:
      - tripwaley_data:/app/data # catalog / reviews / bookings JSON (all admin edits)
      - tripwaley_uploads:/app/public/uploads # photos uploaded via the admin panel
    ports:
      - "3000:3000" # Dokploy/Traefik maps your domain to this port; drop if using Dokploy Domains

volumes:
  tripwaley_data:
  tripwaley_uploads:
